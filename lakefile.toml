name = "ghs"
defaultTargets = ["GHS"]

# Mathlib dependency. The `rev` below and the `lean-toolchain` file must name
# the same released version. Pinned to the exact Mathlib commit used by this
# development; to move to a newer Mathlib, update both, then run
# `lake update` followed by `lake exe cache get`.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "2df2f0150c275ad53cb3c90f7c98ec15a56a1a67"

# GHS: machine verification of Galichon-Hsieh-Sylvestre, "Monotone comparative
# statics for submodular functions, with an application to aggregated deferred
# acceptance". Mathlib-only; see README.md for the result map.
[[lean_lib]]
name = "GHS"
